<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>讨论区 - 深爱炉实馆</title>
  <meta name="description" content="深爱炉实馆讨论区：自由发帖交流。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232c2014'/%3E%3Cpath d='M32 10 L54 32 L32 54 L10 32 Z' fill='%23b8862e'/%3E%3Cpath d='M32 22 L42 32 L32 42 L22 32 Z' fill='%23f6f1e6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 顶部导航栏（四个页面都一样） ===== -->
  <header class="顶栏">
    <div class="容器 顶栏内部">
      <a class="馆名" href="index.html">深爱<span class="金色字">炉实馆</span></a>
      <nav class="导航" id="导航">
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="news.html">公告</a>
        <a href="discussion.html" class="当前页">讨论</a>
      </nav>
      <button class="菜单按钮" onclick="切换菜单()">菜单</button>
    </div>
  </header>

  <!-- ===== 页面标题带 ===== -->
  <section class="页头">
    <h1>讨论区</h1>
    <p>自由发帖，畅所欲言</p>
  </section>

  <!-- ===== 发帖 + 帖子列表 ===== -->
  <section class="区块">
    <div class="容器">
      <h2 class="区块标题">发布新帖</h2>
      <p class="区块副标题">请自觉遵守网络发言公德</p>

      <form class="发帖表单" id="发帖表单" onsubmit="return false;">
        <input class="发帖昵称" id="发帖昵称" type="text" maxlength="12" placeholder="昵称（可不填，默认匿名炉友）">
        <textarea class="发帖内容" id="发帖内容" rows="4" maxlength="1000" placeholder="写点什么…"></textarea>
      <label class="图片选择行">
          <input type="file" id="发帖图片" accept="image/*" class="图片选择隐藏">
          <span class="图片选择按钮">⊕图片</span>
          <span class="图片已选" id="图片已选"></span>
        </label>

        <button class="发帖提交" type="submit">发布</button>
      </form>


      <h2 class="区块标题" style="margin-top:52px;">全部帖子</h2>
      <div class="帖子列表" id="帖子列表"></div>
    </div>
  </section>

  <!-- ===== 页脚（四个页面都一样） ===== -->
  <footer class="页脚">
    <div class="容器 页脚内部">
      <div>
        <h4>深爱炉实馆</h4>
        <p>是由深圳实验炉管社建立的，一个以炉会友的炉管主题空间。</p>
      </div>
      <div>
        <h4>快速导航</h4>
        <p><a href="about.html">关于我们</a></p>
        <p><a href="news.html">公告</a></p>
        <p><a href="discussion.html">讨论</a></p>
      </div>
      <div>
        <h4>联系方式</h4>
        <p>地址：广东省深圳市南山区同发路99号</p>
        <p>电话：0755 8336 1223</p>
        <p>邮箱：aqd_official@foxmail.com</p>
      </div>
    </div>
    <div class="版权行">© 2026 深圳实验炉管社 · 保留所有权利</div>
  </footer>

  <!-- Supabase 客户端库（发帖、点赞、评论依赖） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 讨论区数据与渲染逻辑 -->
  <script src="js/discussion.js"></script>
  <script>
    function 切换菜单() {
      document.getElementById("导航").classList.toggle("展开");
    }
  </script>
</body>
</html>
